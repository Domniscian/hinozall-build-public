name: isolated-hinozall-build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated tree
        shell: bash
        run: |
          set -euo pipefail
          test -f source.tar.xz
          test -f BUILD_SOURCE_MARKER.txt
          test ! -d app
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir src
          tar -xJf source.tar.xz -C src
          test -f src/settings.gradle.kts
          test -f src/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build release
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test assembleRelease
      - name: Align unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK='src/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -p 4 "$APK" out/Hinozall-Awoken-3.6.0-aligned-unsigned.apk
          sha256sum out/Hinozall-Awoken-3.6.0-aligned-unsigned.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hinozall-3.6.0-unsigned
          path: out/*
          if-no-files-found: error

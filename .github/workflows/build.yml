name: Build Hinozall 3.5.1 unsigned

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode canonical source
        run: |
          rm -rf work source.zip
          base64 --decode source.zip.b64 > source.zip
          mkdir work
          unzip -q source.zip -d work
          chmod +x work/gradlew

      - name: Apply final 3.5.1 corrections
        run: python3 prepare_build.py

      - name: Verify no private signing material exists
        run: |
          ! find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' \) | grep .
          ! grep -RIlE 'BEGIN (RSA |EC |)PRIVATE KEY|storePassword[[:space:]]*=|keyPassword[[:space:]]*=' work . --exclude='prepare_build.py' | grep .

      - name: Build unsigned release APK
        working-directory: work
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Locate APK
        run: |
          find work/app/build/outputs/apk -type f -name '*.apk' -print
          APK="$(find work/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Hinozall-Awoken-3.5.1-UNSIGNED.apk
          sha256sum Hinozall-Awoken-3.5.1-UNSIGNED.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinozall-Awoken-3.5.1-unsigned
          path: Hinozall-Awoken-3.5.1-UNSIGNED.apk
          if-no-files-found: error

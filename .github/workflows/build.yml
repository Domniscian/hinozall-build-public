name: Build Hinozall 3.5 exact Mega

on:
  push:
    branches: [ final-35-exact-mega ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode exact Mega source
        run: |
          rm -rf work source.zip
          base64 --decode source.zip.b64 > source.zip
          mkdir work
          unzip -q source.zip -d work
          chmod +x work/gradlew

      - name: Reproduce successful prepared source
        run: python3 prepare_build.py

      - name: Apply exact final Mega patch
        run: |
          echo "bbbc00e7976db8b60dc2b6bd1e7c83188861959435521adb8f0ca467eee7ef08  final_exact.patch" | sha256sum -c -
          (cd work && patch -p1 --batch < ../final_exact.patch)
          python3 - <<'PY'
          from pathlib import Path
          p=Path("work/app/src/main/java/com/domniscian/app/ui/screens/HomeScreen.kt")
          s=p.read_text(encoding="utf-8")
          old="        }\n    }\n\n    SnackbarHost(\n"
          new="        }\n    }\n    }\n\n    SnackbarHost(\n"
          if old not in s:
              raise SystemExit("HomeScreen closure marker not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY

      - name: Verify exact patched source
        run: |
          cd work
          echo "4b94b555e45d4dc58ce58773e10e50cc3e7fd1d2cba1766160216f0c101eb8fb  app/build.gradle.kts" | sha256sum -c -
          echo "bc954c96beaf2445b443bc86ad72f11ab43b70b9472de658d1e1a62c8306c63e  app/src/main/java/com/domniscian/app/MainActivity.kt" | sha256sum -c -
          echo "2ada81827da1bd7e5fa3ceb798b0847d670b752a21eed7878d02a9cdcfc11db4  app/src/main/java/com/domniscian/app/MainViewModel.kt" | sha256sum -c -
          echo "d4b25255d0436809789ba822de798113485e5ca58fcdbb6aa922ace3290e7657  app/src/main/java/com/domniscian/app/background/PresenceMonitorService.kt" | sha256sum -c -
          echo "8fb097eef9ed8461b4ededa08b43a8d11368a417d32a00ecbe0d633615eac5fc  app/src/main/java/com/domniscian/app/ui/screens/HomeScreen.kt" | sha256sum -c -
          echo "fb3a89a0572631aa63bb7f57db003049f99a12089b249c4cee8eb231fc1ce36c  app/src/main/java/com/domniscian/app/ui/screens/MessagesScreen.kt" | sha256sum -c -
          echo "ce2a9c6a4f05d89d858d5bbce22db3c4a181e3d7308eb2540bed1fbe2932ef05  app/src/main/java/com/domniscian/app/ui/screens/SettingsScreen.kt" | sha256sum -c -
          echo "2b9dc9147ce839238418266ce3fd80871e45f5ca9dce17d9e07d219b4d459719  app/src/main/java/com/domniscian/app/instagram/InstagramLoginActivity.kt" | sha256sum -c -
          grep -Fq 'HorizontalPager' app/src/main/java/com/domniscian/app/MainActivity.kt
          grep -Fq 'Aucune cible sélectionnée à actualiser.' app/src/main/java/com/domniscian/app/MainViewModel.kt
          grep -Fq 'Afficher l’horloge' app/src/main/java/com/domniscian/app/ui/screens/HomeScreen.kt
          grep -Fq 'HINOZALL_AWOKEN' app/src/main/java/com/domniscian/app/model/Models.kt
          grep -Fq 'DOM-526' app/src/main/java/com/domniscian/app/instagram/InstagramLoginActivity.kt
          grep -Fq 'DOM-529' app/src/main/java/com/domniscian/app/instagram/InstagramLoginActivity.kt
          grep -Fq 'android:supportsPictureInPicture="true"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:resizeableActivity="true"' app/src/main/AndroidManifest.xml

      - name: Verify no private signing material
        run: |
          ! find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'keystore.properties' \) | grep .
          ! grep -RIlE 'BEGIN (RSA |EC |)PRIVATE KEY' work . --exclude='prepare_build.py' | grep .

      - name: Run unit tests
        working-directory: work
        run: ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Build unsigned release APK
        working-directory: work
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Align APK
        run: |
          APK="$(find work/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -f -p 4 "$APK" Hinozall-Awoken-3.5-FINAL-UNSIGNED-ALIGNED.apk
          sha256sum Hinozall-Awoken-3.5-FINAL-UNSIGNED-ALIGNED.apk

      - name: Package exact final source
        run: |
          (cd work && zip -qr ../Hinozall-Awoken-3.5-FINAL-SOURCE.zip . -x 'app/build/*' -x '.gradle/*' -x 'build/*' -x 'local.properties' -x '*.jks' -x '*.keystore' -x 'keystore.properties')
          sha256sum Hinozall-Awoken-3.5-FINAL-SOURCE.zip

      - name: Upload unsigned APK and exact source
        uses: actions/upload-artifact@v4
        with:
          name: Hinozall-Awoken-3.5-EXACT-MEGA-build
          path: |
            Hinozall-Awoken-3.5-FINAL-UNSIGNED-ALIGNED.apk
            Hinozall-Awoken-3.5-FINAL-SOURCE.zip
          if-no-files-found: error
